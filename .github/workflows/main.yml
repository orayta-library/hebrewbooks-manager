name: HebrewBooks Download

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download HebrewBooks and build JSONL chunks
        run: |
          python download_hebrewbooks.py \
            --start-id 1 \
            --end-id 69799 \
            --max-artifact-bytes 2147483648 \
            --artifact-dir artifacts \
            --temp-dir tmp \
            --sleep-seconds 10

      - name: Upload artifact chunks
        uses: actions/upload-artifact@v4
        with:
          name: hebrewbooks-json-chunks
          path: artifacts/*.jsonl
